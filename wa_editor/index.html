<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Quill (open-source rich-text editor), pinned. If it can't load, editor.js
     falls back to a plain text box. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<style>
  :root {
    --text: #31333f;
    --background: #ffffff;
    --secondary-background: #f0f2f6;
    --primary: #ff4b4b;
    --font: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --border: rgba(128, 128, 128, 0.35);
  }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); }

  #toolbar.ql-toolbar.ql-snow {
    border: 1px solid var(--border); border-radius: 8px 8px 0 0;
    background: var(--secondary-background); font-family: var(--font);
  }
  #editor.ql-container.ql-snow {
    border: 1px solid var(--border); border-top: 0; border-radius: 0 0 8px 8px;
    background: var(--background); font-family: var(--font); font-size: 15px;
  }
  .ql-editor { min-height: 300px; max-height: 480px; overflow-y: auto; line-height: 1.5; color: var(--text); }
  .ql-editor.ql-blank::before { color: var(--text); opacity: 0.5; font-style: normal; }
  .ql-snow .ql-editor code { background: rgba(128, 128, 128, 0.15); border-radius: 3px; padding: 0 3px; }
  .ql-snow .ql-editor blockquote { border-left: 3px solid var(--border); padding-left: 10px; }

  /* Toolbar icons follow the Streamlit theme (light or dark). */
  .ql-snow .ql-stroke { stroke: var(--text); }
  .ql-snow .ql-fill { fill: var(--text); }
  .ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke: var(--primary); }
  .ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: var(--primary); }

  #insert-name {
    width: auto; padding: 0 8px; font: 13px var(--font); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; background: var(--background); cursor: pointer;
  }
  #insert-name:hover { color: var(--primary); border-color: var(--primary); }

  #plain {
    box-sizing: border-box; width: 100%; min-height: 300px; padding: 10px 12px;
    font: 15px/1.5 var(--font); color: var(--text); background: var(--background);
    border: 1px solid var(--border); border-top: 0; border-radius: 0 0 8px 8px; resize: vertical;
  }
  .note { font-size: 13px; opacity: 0.75; margin: 6px 2px 0; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="ql-formats format-buttons">
    <button class="ql-bold" title="Bold (⌘B / Ctrl+B)"></button>
    <button class="ql-italic" title="Italic (⌘I / Ctrl+I)"></button>
    <button class="ql-strike" title="Strikethrough (⌘⇧X / Ctrl+Shift+X)"></button>
    <button class="ql-code" title="Monospace"></button>
  </span>
  <span class="ql-formats format-buttons">
    <button class="ql-list" value="bullet" title="Bulleted list"></button>
    <button class="ql-list" value="ordered" title="Numbered list"></button>
    <button class="ql-blockquote" title="Quote"></button>
  </span>
  <span class="ql-formats format-buttons">
    <button class="ql-clean" title="Clear formatting"></button>
  </span>
  <span class="ql-formats">
    <button type="button" id="insert-name" title="Insert the guest's name (their Addressable Name)">+ {name}</button>
  </span>
</div>
<div id="editor"></div>
<textarea id="plain" hidden></textarea>
<div id="note" class="note" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="convert.js"></script>
<script src="editor.js"></script>
</body>
</html>
